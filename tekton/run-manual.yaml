apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: konflux-mini-manual-
spec:
  pipelineRef:
    name: konflux-mini
  taskRunTemplate:
    serviceAccountName: pipeline-sa
  params:
    - name: git-url
      value: https://github.com/Peterk04/konflux-mini-pipeline.git
    - name: git-revision
      value: main
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: dockerconfig
      secret:
        secretName: quay-creds
        items:
          - key: .dockerconfigjson
            path: config.json
